<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ALK Coin</title><style>*{box-sizing:border-box}body{ margin:0; min-height:100vh; background:radial-gradient(circle at top,#30220a,#090909 65%); color:#fff; font-family:Arial,sans-serif; text-align:center; padding:25px 15px;}h1{color:#f8c94b;font-size:34px;letter-spacing:4px}.subtitle{color:#c9c9c9}.balance{font-size:38px;font-weight:bold;color:#ffd45b;margin:25px 0 5px}.label{color:#aaa}.coin{ width:220px;height:220px;border-radius:50%; margin:30px auto; display:flex;align-items:center;justify-content:center; background:radial-gradient(circle,#ffe88b,#e5a900 60%,#6d4000); border:8px double #fff0a3; box-shadow:0 0 35px #d99b00; color:#211400;font-size:64px;font-weight:900; cursor:pointer;user-select:none; transition:transform .08s;}.coin:active{transform:scale(.94)}button{ background:linear-gradient(135deg,#ffe27a,#d99a00); color:#171000;border:0;border-radius:12px; padding:14px 20px;font-size:16px;font-weight:bold; cursor:pointer;margin:6px;}.card{ background:#ffffff0d;border:1px solid #7e621f; border-radius:16px;padding:18px;margin:12px auto; max-width:420px;}.small{font-size:13px;color:#aaa;line-height:1.6}</style></head><body><h1>ALK COIN</h1><div class="subtitle">Dijital Ödül Dünyasına Hoş Geldin</div><div class="card"> <div class="label">TOPLAM ALK PUANIN</div> <div class="balance" id="balance">0</div> <div class="small">Oyun içi puan</div></div><div class="coin" id="coin" onclick="earn()">ALK</div><div> Kazanmak için ALK Coin'e dokun!</div><div class="card"> <div> Enerji: <b id="energy">100</b>/100</div> <button onclick="dailyReward()"> Günlük Ödül</button> <button onclick="recoverEnergy()"> Enerji Yenile</button></div><div class="card"> <h3> ALK Coin Kulübü</h3> <div class="small">Puanlarını topla, oyuna katıl ve yüksel!</div></div><p class="small">Bu sürüm bir oyun prototipidir. Puanlar gerçek kripto para değildir.</p><script>let balance=Number(localStorage.getItem("alkBalance")||0);let energy=Number(localStorage.getItem("alkEnergy")||100);const today=()=>new Date().toLocaleDateString("en-CA");function save(){ localStorage.setItem("alkBalance",balance); localStorage.setItem("alkEnergy",energy); document.getElementById("balance").textContent=balance.toLocaleString("tr-TR"); document.getElementById("energy").textContent=energy;}function earn(){ if(energy<=0){alert("Enerjin bitti! Yenilenmesini bekle.");return;} balance+=1;energy-=1;save();}function dailyReward(){ if(localStorage.getItem("alkDaily")==today()){ alert("Günlük ödülünü bugün zaten aldın!");return; } balance+=100; localStorage.setItem("alkDaily",today()); save();alert("Tebrikler! 100 ALK oyun puanı kazandın.");}function recoverEnergy(){ energy=100;save();alert("Enerjin yenilendi!");}save();</script></body></html>
